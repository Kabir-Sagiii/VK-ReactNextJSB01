<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./Container.css" />
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      function Card(props) {
        return (
          <div id="card">
            <img src={props.image} width="100%" height="90%" />
            <h4>{props.offer}</h4>
          </div>
        );
      }

      function MainContainer(props) {
        return (
          <div id="main-container">
            <div>
              <h2>{props.title}</h2>
            </div>
            <div>
              <Card image={""} offer={""} />
              <Card image={""} offer={""} />
              <Card image={""} offer={""} />
              <Card image={""} offer={""} />
            </div>
          </div>
        );
      }

      function App() {
        return (
          <div>
            <MainContainer title={"Best Seller"} />
            <MainContainer title={"Widest Collection"} />
            <MainContainer title={"Spolight's On"} />
            <MainContainer title={"Home Decors & furnishing"} />
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
